[versions]
agp = "8.5.2"
kotlin = "2.0.20"
ksp = "2.0.20-1.0.25"
hilt = "2.51.1"
hilt-navigation-compose = "1.2.0"
compose-bom = "2024.09.02"
activity-compose = "1.9.2"
lifecycle = "2.8.6"
navigation-compose = "2.8.1"
retrofit = "2.11.0"
okhttp = "4.12.0"
moshi = "1.15.1"
coil = "2.7.0"
datastore = "1.1.1"
vico = "2.0.0-beta.3"
core-ktx = "1.13.1"
material3 = "1.3.0"
work = "2.9.1"
firebase-bom = "33.3.0"
google-services = "4.4.2"

[libraries]
androidx-core-ktx           = { group = "androidx.core",       name = "core-ktx",           version.ref = "core-ktx" }
androidx-activity-compose   = { group = "androidx.activity",   name = "activity-compose",   version.ref = "activity-compose" }
androidx-lifecycle-runtime  = { group = "androidx.lifecycle",  name = "lifecycle-runtime-ktx",       version.ref = "lifecycle" }
androidx-lifecycle-vm       = { group = "androidx.lifecycle",  name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigation-compose" }
androidx-datastore          = { group = "androidx.datastore",  name = "datastore-preferences", version.ref = "datastore" }
androidx-work-runtime       = { group = "androidx.work",       name = "work-runtime-ktx",   version.ref = "work" }

androidx-compose-bom        = { group = "androidx.compose",    name = "compose-bom",        version.ref = "compose-bom" }
androidx-compose-ui         = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-foundation = { group = "androidx.compose.foundation", name = "foundation" }
androidx-compose-material3  = { group = "androidx.compose.material3",  name = "material3" }
androidx-compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }

retrofit         = { group = "com.squareup.retrofit2", name = "retrofit",         version.ref = "retrofit" }
retrofit-moshi   = { group = "com.squareup.retrofit2", name = "converter-moshi",  version.ref = "retrofit" }
okhttp-logging   = { group = "com.squareup.okhttp3",   name = "logging-interceptor", version.ref = "okhttp" }
moshi            = { group = "com.squareup.moshi",     name = "moshi",            version.ref = "moshi" }
moshi-kotlin     = { group = "com.squareup.moshi",     name = "moshi-kotlin",     version.ref = "moshi" }
moshi-codegen    = { group = "com.squareup.moshi",     name = "moshi-kotlin-codegen", version.ref = "moshi" }

coil-compose     = { group = "io.coil-kt",             name = "coil-compose",     version.ref = "coil" }

hilt-android        = { group = "com.google.dagger",   name = "hilt-android",        version.ref = "hilt" }
hilt-compiler       = { group = "com.google.dagger",   name = "hilt-android-compiler", version.ref = "hilt" }
hilt-navigation     = { group = "androidx.hilt",       name = "hilt-navigation-compose", version.ref = "hilt-navigation-compose" }

vico-compose-m3  = { group = "com.patrykandpatrick.vico", name = "compose-m3",  version.ref = "vico" }

firebase-bom     = { group = "com.google.firebase",      name = "firebase-bom",      version.ref = "firebase-bom" }
firebase-messaging = { group = "com.google.firebase",    name = "firebase-messaging-ktx" }

[plugins]
android-application = { id = "com.android.application",          version.ref = "agp" }
kotlin-android      = { id = "org.jetbrains.kotlin.android",      version.ref = "kotlin" }
kotlin-compose      = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp                 = { id = "com.google.devtools.ksp",           version.ref = "ksp" }
hilt                = { id = "com.google.dagger.hilt.android",    version.ref = "hilt" }
google-services     = { id = "com.google.gms.google-services",    version.ref = "google-services" }
