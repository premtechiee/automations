name: Stock Analyzer

# ──────────────────────────────────────────────────────────────────────────
# Analyzer-only workflow. Runs `scripts/stock_analyzer.py` to generate the
# daily picks (data/stock_reports/<today>.json) and pushes the formatted
# image / PDF report to WhatsApp or Telegram.
#
# Trading on those picks (paper or live) is owned by a separate workflow
# (`angel_one.yml`) which calls into this analyzer internally when today's
# picks are stale. Keep this workflow free of broker logic.
#
# Schedules in UTC; IST = UTC + 5:30. Mon–Fri.
# GitHub may delay scheduled runs by 5–30 min — crons are set a few minutes
# earlier than the desired IST time.
# ──────────────────────────────────────────────────────────────────────────
on:
  schedule:
    - cron: '30 2 * * 1-5'        # 08:00 IST → PRE-OPEN briefing
    - cron: '0 4 * * 1-5'         # 09:30 IST → MARKET-OPEN confirmation
    - cron: '30 8 * * 1-5'        # 14:00 IST → MID-SESSION update

  workflow_dispatch:
    inputs:
      command:
        description: 'Stock-analyzer command to run'
        required: true
        default: '--dry-run'
        type: choice
        options:
          - '--preopen'
          - '--morning'
          - '--afternoon'
          - '--now'
          - '--dry-run'
          - '--test'
      channel:
        description: 'Delivery channel'
        required: false
        default: 'whatsapp'
        type: choice
        options: ['whatsapp', 'telegram']

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install --quiet -r requirements.txt

      # ─── Map secrets to env so every step inherits them ───
      - name: Load runtime secrets into environment
        run: |
          {
            echo "GOLD_PHONE_NUMBER=${{ secrets.GOLD_PHONE_NUMBER }}"
            echo "GREEN_API_INSTANCE=${{ secrets.GREEN_API_INSTANCE }}"
            echo "GREEN_API_TOKEN=${{ secrets.GREEN_API_TOKEN }}"
            echo "TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}"
            echo "TELEGRAM_CHAT_ID=${{ secrets.TELEGRAM_CHAT_ID }}"
          } >> "$GITHUB_ENV"

      # ─── Scheduled jobs (one matches per cron expression) ───
      - name: Pre-open briefing (08:00 IST)
        if: github.event_name == 'schedule' && github.event.schedule == '30 2 * * 1-5'
        run: python scripts/stock_analyzer.py --preopen --channel whatsapp

      - name: Market-open confirmation (09:30 IST)
        if: github.event_name == 'schedule' && github.event.schedule == '0 4 * * 1-5'
        run: python scripts/stock_analyzer.py --morning --channel whatsapp

      - name: Mid-session check (14:00 IST)
        if: github.event_name == 'schedule' && github.event.schedule == '30 8 * * 1-5'
        run: python scripts/stock_analyzer.py --afternoon --channel whatsapp

      - name: Manual run
        if: github.event_name == 'workflow_dispatch'
        run: |
          python scripts/stock_analyzer.py \
            ${{ github.event.inputs.command }} \
            --channel ${{ github.event.inputs.channel }}
