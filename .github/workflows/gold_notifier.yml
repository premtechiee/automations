name: Gold Price Notifier

# ──────────────────────────────────────────────────────────────────────────
# Schedule in UTC; IST = UTC + 5:30. Mon–Sat (1-6).
# GitHub may delay scheduled runs by 5–30 min under load — cron is set a
# few minutes earlier than the desired IST time.
# Note: scheduled triggers fire only from the repository's DEFAULT branch
# and are auto-disabled after 60 days of repo inactivity.
# ──────────────────────────────────────────────────────────────────────────
on:
  schedule:
    - cron: '20 2 * * 1-6'   # ~08:00 IST → morning briefing  (UTC 02:20)
    - cron: '20 8 * * 1-6'   # ~14:00 IST → afternoon drop check (UTC 08:20)

  workflow_dispatch:
    inputs:
      command:
        description: 'Command to run'
        required: true
        default: '--test'
        type: choice
        options:
          - '--test'
          - '--now'
          - '--morning'
          - '--afternoon'
          - '--check'
          - '--dry-run'

permissions:
  contents: read

jobs:
  run-notifier:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: pip install --quiet -r requirements.txt

      # ─── Map secrets → env once, reused by every step below ───
      - name: Load runtime secrets into environment
        run: |
          {
            echo "GOLD_PHONE_NUMBER=${{ secrets.GOLD_PHONE_NUMBER }}"
            echo "GOLD_PHONE_NUMBERS=${{ secrets.GOLD_PHONE_NUMBERS }}"
            echo "GREEN_API_INSTANCE=${{ secrets.GREEN_API_INSTANCE }}"
            echo "GREEN_API_TOKEN=${{ secrets.GREEN_API_TOKEN }}"
            echo "GREEN_API_URL=${{ secrets.GREEN_API_URL }}"
            echo "TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}"
            echo "TELEGRAM_CHAT_ID=${{ secrets.TELEGRAM_CHAT_ID }}"
          } >> "$GITHUB_ENV"

      - name: Decide run mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "args=${{ github.event.inputs.command }}" >> "$GITHUB_OUTPUT"
          else
            # Scheduled run — pick morning vs afternoon by current UTC hour.
            # Morning cron fires near 02:xx UTC (~08:00 IST).
            # Afternoon cron fires near 08:xx UTC (~14:00 IST).
            HOUR=$(date -u +%H)
            if [ "$HOUR" -lt 6 ]; then
              echo "args=--morning" >> "$GITHUB_OUTPUT"
            else
              echo "args=--afternoon" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Run notifier
        run: python scripts/gold_notifier.py ${{ steps.mode.outputs.args }} --channel whatsapp
