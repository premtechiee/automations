name: Gold Price Notifier

on:
  schedule:
    # All times UTC (IST = UTC+5:30). Note: GitHub may delay by up to 30-60 min.
    - cron: '0 4 * * 1-6'    # 09:30 IST Mon–Sat  → morning briefing
    - cron: '30 8 * * 1-6'   # 14:00 IST Mon–Sat  → afternoon drop check
    - cron: '30 4 * * 1-6'   # 10:00 IST Mon–Sat  → mid-morning threshold check
    - cron: '30 6 * * 1-6'   # 12:00 IST Mon–Sat  → midday threshold check
    - cron: '30 10 * * 1-6'  # 16:00 IST Mon–Sat  → evening threshold check

  # Allow manual trigger from GitHub Actions UI
  workflow_dispatch:
    inputs:
      command:
        description: 'Command to run'
        required: true
        default: '--test'
        type: choice
        options:
          - '--test'
          - '--now'
          - '--morning'
          - '--afternoon'
          - '--check'
          - '--dry-run'

jobs:
  run-notifier:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Morning briefing (10:30 IST)
        if: github.event_name == 'schedule' && github.event.schedule == '0 5 * * 1-6'
        env:
          GOLD_PHONE_NUMBER:   ${{ secrets.GOLD_PHONE_NUMBER }}
          GREEN_API_INSTANCE:  ${{ secrets.GREEN_API_INSTANCE }}
          GREEN_API_TOKEN:     ${{ secrets.GREEN_API_TOKEN }}
        run: python scripts/gold_notifier.py --morning --channel whatsapp

      - name: Afternoon drop check (15:00 IST)
        if: github.event_name == 'schedule' && github.event.schedule == '30 9 * * 1-6'
        env:
          GOLD_PHONE_NUMBER:   ${{ secrets.GOLD_PHONE_NUMBER }}
          GREEN_API_INSTANCE:  ${{ secrets.GREEN_API_INSTANCE }}
          GREEN_API_TOKEN:     ${{ secrets.GREEN_API_TOKEN }}
        run: python scripts/gold_notifier.py --afternoon --channel whatsapp

      - name: Threshold check (mid-morning / midday / evening)
        if: >
          github.event_name == 'schedule' && (
            github.event.schedule == '30 5 * * 1-6' ||
            github.event.schedule == '30 7 * * 1-6' ||
            github.event.schedule == '30 11 * * 1-6'
          )
        env:
          GOLD_PHONE_NUMBER:   ${{ secrets.GOLD_PHONE_NUMBER }}
          GREEN_API_INSTANCE:  ${{ secrets.GREEN_API_INSTANCE }}
          GREEN_API_TOKEN:     ${{ secrets.GREEN_API_TOKEN }}
        run: python scripts/gold_notifier.py --check --channel whatsapp

      - name: Manual run
        if: github.event_name == 'workflow_dispatch'
        env:
          GOLD_PHONE_NUMBER:   ${{ secrets.GOLD_PHONE_NUMBER }}
          GREEN_API_INSTANCE:  ${{ secrets.GREEN_API_INSTANCE }}
          GREEN_API_TOKEN:     ${{ secrets.GREEN_API_TOKEN }}
        run: python scripts/gold_notifier.py ${{ github.event.inputs.command }} --channel whatsapp
