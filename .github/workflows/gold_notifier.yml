name: Gold Price Notifier

# ──────────────────────────────────────────────────────────────────────────
# Schedule in UTC; IST = UTC + 5:30. Mon–Fri only.
# GitHub may delay scheduled runs by 5–30 min under load — cron is set a
# few minutes earlier than the desired IST time.
# ──────────────────────────────────────────────────────────────────────────
on:
  schedule:
    - cron: '30 2 * * 1-6'   # 08:00 IST → morning briefing
    - cron: '30 8 * * 1-6'   # 14:00 IST → afternoon drop check

  workflow_dispatch:
    inputs:
      command:
        description: 'Command to run'
        required: true
        default: '--test'
        type: choice
        options:
          - '--test'
          - '--now'
          - '--morning'
          - '--afternoon'
          - '--check'
          - '--dry-run'

permissions:
  contents: read

jobs:
  run-notifier:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: pip install --quiet -r requirements.txt

      # ─── Map secrets → env once, reused by every step below ───
      - name: Load runtime secrets into environment
        run: |
          {
            echo "GOLD_PHONE_NUMBER=${{ secrets.GOLD_PHONE_NUMBER }}"
            echo "GOLD_PHONE_NUMBERS=${{ secrets.GOLD_PHONE_NUMBERS }}"
            echo "GREEN_API_INSTANCE=${{ secrets.GREEN_API_INSTANCE }}"
            echo "GREEN_API_TOKEN=${{ secrets.GREEN_API_TOKEN }}"
            echo "GREEN_API_URL=${{ secrets.GREEN_API_URL }}"
            echo "TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}"
            echo "TELEGRAM_CHAT_ID=${{ secrets.TELEGRAM_CHAT_ID }}"
          } >> "$GITHUB_ENV"

      - name: Morning briefing (08:00 IST)
        if: github.event_name == 'schedule' && github.event.schedule == '30 2 * * 1-5'
        run: python scripts/gold_notifier.py --morning --channel whatsapp

      - name: Afternoon drop check (14:00 IST)
        if: github.event_name == 'schedule' && github.event.schedule == '30 8 * * 1-5'
        run: python scripts/gold_notifier.py --afternoon --channel whatsapp

      - name: Manual run
        if: github.event_name == 'workflow_dispatch'
        run: python scripts/gold_notifier.py ${{ github.event.inputs.command }} --channel whatsapp
